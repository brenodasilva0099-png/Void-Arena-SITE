    <path d="M374 111H586L567 251C558 319 524 356 480 356C436 356 402 319 393 251L374 111Z" fill="url(#metal)" stroke="#B875FF" stroke-width="6"/>
    <path d="M414 141H546L535 242C529 294 508 325 480 325C452 325 431 294 425 242L414 141Z" fill="url(#metalShade)" stroke="#DAB8FF" stroke-opacity=".34" stroke-width="2"/>

    <!-- upper rim / lip -->
