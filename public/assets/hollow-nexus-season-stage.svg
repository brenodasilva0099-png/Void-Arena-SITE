<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <defs>
    <linearGradient id="metal" x1="355" y1="95" x2="610" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF8FF"/>
      <stop offset=".11" stop-color="#E9D5FF"/>
      <stop offset=".27" stop-color="#C59AFF"/>
      <stop offset=".46" stop-color="#9147F0"/>
      <stop offset=".68" stop-color="#6324B9"/>
      <stop offset=".86" stop-color="#35105E"/>
      <stop offset="1" stop-color="#160921"/>
    </linearGradient>
    <linearGradient id="metalShade" x1="520" y1="110" x2="405" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F0D4B"/>
      <stop offset=".5" stop-color="#14091F"/>
      <stop offset="1" stop-color="#050408"/>
    </linearGradient>
    <linearGradient id="rim" x1="368" y1="94" x2="592" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#DCC3FF"/>
      <stop offset=".5" stop-color="#8F42E9"/>
      <stop offset=".78" stop-color="#D2A8FF"/>
      <stop offset="1" stop-color="#F7EEFF"/>
    </linearGradient>
    <linearGradient id="base" x1="480" y1="336" x2="480" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7E37D5"/>
      <stop offset=".22" stop-color="#4E197F"/>
      <stop offset=".52" stop-color="#20102E"/>
      <stop offset="1" stop-color="#08050D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(485 314) rotate(90) scale(202 344)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AF68FF" stop-opacity=".44"/>
      <stop offset=".34" stop-color="#8536EA" stop-opacity=".24"/>
      <stop offset=".72" stop-color="#5B20B5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3A0F7E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medal" cx="0" cy="0" r="1" gradientTransform="translate(480 211) rotate(90) scale(68)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7EDFF"/>
      <stop offset=".24" stop-color="#D9BAFF"/>
      <stop offset=".58" stop-color="#8C43E7"/>
      <stop offset="1" stop-color="#331053"/>
    </radialGradient>
    <linearGradient id="star" x1="480" y1="157" x2="480" y2="259" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#EBD9FF"/>
      <stop offset=".58" stop-color="#BC78FF"/>
      <stop offset="1" stop-color="#772ADD"/>
    </linearGradient>
    <filter id="softGlow" x="256" y="40" width="448" height="446" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" values="1 0 0 0 .50 0 1 0 0 .18 0 0 1 0 .95 0 0 0 .5 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="shine" x="365" y="92" width="160" height="240" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <ellipse cx="480" cy="344" rx="360" ry="136" fill="url(#halo)"/>
  <path d="M52 185C202 32 758 32 908 185" stroke="#8E43F2" stroke-opacity=".22" stroke-width="2"/>
  <path d="M18 225C198 58 762 58 942 225" stroke="#B874FF" stroke-opacity=".12" stroke-width="2"/>
  <path d="M154 132C269 58 691 58 806 132" stroke="#C491FF" stroke-opacity=".1" stroke-width="1.5"/>

  <g filter="url(#softGlow)">
    <!-- rear handles -->
    <path d="M382 146C327 142 298 180 304 228C311 287 350 326 414 338L429 291C383 280 359 255 355 219C353 197 364 187 388 188L382 146Z" fill="#2A0C42" stroke="#8B44DC" stroke-width="6"/>
    <path d="M578 146C633 142 662 180 656 228C649 287 610 326 546 338L531 291C577 280 601 255 605 219C607 197 596 187 572 188L578 146Z" fill="#2A0C42" stroke="#8B44DC" stroke-width="6"/>
    <path d="M365 164C330 168 324 190 328 218C333 253 350 276 380 291" stroke="#C08EFF" stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
    <path d="M595 164C630 168 636 190 632 218C627 253 610 276 580 291" stroke="#C08EFF" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>

