    <ellipse cx="480" cy="113" rx="94" ry="18" fill="#12081B" fill-opacity=".66" stroke="#F4E8FF" stroke-opacity=".48" stroke-width="2"/>
    <ellipse cx="480" cy="113" rx="72" ry="11" stroke="#A85FFF" stroke-opacity=".3" stroke-width="2"/>

    <!-- front medal -->
    <circle cx="480" cy="210" r="74" fill="#100619" fill-opacity=".88" stroke="#C389FF" stroke-opacity=".55" stroke-width="4"/>
    <circle cx="480" cy="210" r="61" fill="url(#medal)" fill-opacity=".38" stroke="#A75DFF" stroke-opacity=".42" stroke-width="2"/>
    <circle cx="480" cy="210" r="46" fill="#14091E" fill-opacity=".72" stroke="#D3A8FF" stroke-opacity=".18"/>
    <path d="M480 156L494 193L533 207L494 222L480 261L466 222L427 207L466 193L480 156Z" fill="url(#star)" stroke="#FBF7FF" stroke-width="2.4"/>
    <circle cx="480" cy="206" r="8" fill="#FFF" fill-opacity=".92"/>
    <text x="480" y="287" text-anchor="middle" fill="#E6D1FF" font-family="Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4">HNL</text>

    <!-- stem and stepped pedestal -->
    <path d="M449 350H511L523 386H437L449 350Z" fill="url(#base)" stroke="#A25AF0" stroke-width="4"/>
    <path d="M420 382H540L562 414H398L420 382Z" fill="url(#base)" stroke="#7E35CC" stroke-width="3"/>
    <path d="M374 411H586L615 447H345L374 411Z" fill="#0C0712" stroke="#6E2DBA" stroke-width="3"/>
    <path d="M400 419H560" stroke="#C695FF" stroke-opacity=".28" stroke-width="2"/>
    <path d="M389 430H571" stroke="#6E2CB9" stroke-opacity=".36" stroke-width="1.5"/>

    <!-- metallic highlight -->
    <path d="M405 130C414 174 418 229 430 276C440 316 455 335 473 342" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="11" stroke-linecap="round"/>
    <path d="M420 130L431 195" stroke="#FFFFFF" stroke-opacity=".56" stroke-width="3" stroke-linecap="round"/>
    <path d="M550 144C541 190 536 245 522 289" stroke="#CA8CFF" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- stage rings -->
  <ellipse cx="480" cy="455" rx="232" ry="32" fill="#4A158A" fill-opacity=".12" stroke="#803BE5" stroke-opacity=".66" stroke-width="3"/>
  <ellipse cx="480" cy="455" rx="174" ry="21" stroke="#C487FF" stroke-opacity=".28" stroke-width="2"/>
  <ellipse cx="480" cy="455" rx="108" ry="9" fill="#A856FF" fill-opacity=".15"/>
  <path d="M306 455H654" stroke="#A65EFF" stroke-opacity=".10" stroke-width="1"/>
</svg>
